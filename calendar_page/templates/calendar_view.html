{% extends "base.html" %}
{% block title %}Calendar – Study Helper{% endblock %}

{% block extra_head %}
<style>
  /* ── Calendar grid ── */
  .cal-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-weight: 600;
    background: #007bff;
    color: #fff;
    border-radius: 6px 6px 0 0;
  }
  .cal-header div { padding: .5rem 0; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-left: 1px solid #dee2e6;
    border-top: 1px solid #dee2e6;
  }
  .cal-cell {
    min-height: 100px;
    border-right: 1px solid #dee2e6;
    border-bottom: 1px solid #dee2e6;
    padding: 4px;
    background: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  .cal-cell:hover { background: #f0f4ff; }
  .cal-cell.today  { background: #e8f0fe; }
  .cal-cell.other-month .day-num { color: #adb5bd; }

  .day-num {
    font-size: .8rem;
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* ── Event pills ── */
  .event-pill {
    display: block;
    font-size: .7rem;
    padding: 1px 5px;
    border-radius: 3px;
    margin-bottom: 2px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: #007bff;
    color: #fff;
  }
  .event-pill:hover { opacity: .85; }

  /* ── Nav ── */
  #cal-month-label { min-width: 180px; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">📅 My Calendar</h4>
  <button class="btn btn-primary btn-sm" id="btn-new-event">+ New Event</button>
</div>

<!-- Month navigation -->
<div class="d-flex align-items-center mb-2">
  <button class="btn btn-outline-secondary btn-sm mr-2" id="btn-prev">&#8249;</button>
  <strong id="cal-month-label"></strong>
  <button class="btn btn-outline-secondary btn-sm ml-2" id="btn-next">&#8250;</button>
  <button class="btn btn-link btn-sm ml-3" id="btn-today">Today</button>
</div>

<!-- Calendar -->
<div class="cal-header">
  <div>Sun</div><div>Mon</div><div>Tue</div>
  <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>
<div class="cal-grid" id="cal-grid"></div>

<!-- ── CREATE / EDIT Modal ── -->
<div class="modal fade" id="eventModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">New Event</h5>
        <button type="button" class="close" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <div id="modal-error" class="alert alert-danger d-none"></div>

        <!-- Title -->
        <div class="form-group">
          <label for="f-title">Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="f-title" placeholder="e.g. Math Exam" maxlength="250">
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="f-desc">Description</label>
          <textarea class="form-control" id="f-desc" rows="2" placeholder="Optional notes…"></textarea>
        </div>

        <!-- Start -->
        <div class="form-group">
          <label for="f-start">Start Date &amp; Time <span class="text-danger">*</span></label>
          <input type="datetime-local" class="form-control" id="f-start">
        </div>

        <!-- Duration -->
        <div class="form-group">
          <label for="f-duration">Duration (minutes)</label>
          <input type="number" class="form-control" id="f-duration" value="60" min="5" max="1440">
        </div>

        <!-- Tags -->
        <div class="form-group">
          <label for="f-tags">
            Tags
            <small class="text-muted">(comma-separated)</small>
          </label>
          <input type="text" class="form-control" id="f-tags" placeholder="e.g. exam, math, group">
          <div id="tag-preview" class="mt-1"></div>
        </div>
      </div><!-- /modal-body -->

      <div class="modal-footer">
        <button type="button" class="btn btn-danger d-none" id="btn-delete">Delete</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save">Save Event</button>
      </div>

    </div>
  </div>
</div>
{% endblock %}


{% block extra_scripts %}
<script>
// ── CSRF helper ──
function getCookie(name) {
  let v = null;
  document.cookie.split(';').forEach(c => {
    c = c.trim();
    if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
  });
  return v;
}
const CSRF = getCookie('csrftoken');

// ── State ──
let allEvents = [];
let currentYear, currentMonth;   // 0-based month
let editingId = null;

// ── Fetch all events from Django ──
async function loadEvents() {
  const res = await fetch("{% url 'events_json' %}");
  allEvents = await res.json();
  renderCalendar();
}

// ── Calendar render ──
function renderCalendar() {
  const label = document.getElementById('cal-month-label');
  const grid  = document.getElementById('cal-grid');

  const monthNames = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
  label.textContent = `${monthNames[currentMonth]} ${currentYear}`;

  const firstDay  = new Date(currentYear, currentMonth, 1).getDay();  // 0=Sun
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();

  grid.innerHTML = '';

  // Blank cells before the 1st
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    grid.appendChild(cell);
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    const isToday = (d === today.getDate() &&
                     currentMonth === today.getMonth() &&
                     currentYear  === today.getFullYear());
    cell.className = 'cal-cell' + (isToday ? ' today' : '');

    // Day number
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);

    // Events on this day
    const dayStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = allEvents.filter(e => e.start.startsWith(dayStr));
    dayEvents.forEach(ev => {
      const pill = document.createElement('span');
      pill.className = 'event-pill';
      pill.textContent = ev.title;
      // Bootstrap tooltip with details
      pill.setAttribute('data-toggle', 'tooltip');
      pill.setAttribute('data-placement', 'top');
      pill.setAttribute('title',
        `${ev.start.slice(11,16)} · ${ev.duration} min` +
        (ev.description ? `\n${ev.description}` : '')
      );
      pill.addEventListener('click', e => { e.stopPropagation(); openEdit(ev.id); });
      cell.appendChild(pill);
    });

    // Click empty cell → open create with that date pre-filled
    cell.addEventListener('click', () => openCreate(dayStr));

    grid.appendChild(cell);
  }

  // Init tooltips
  $('[data-toggle="tooltip"]').tooltip({ trigger: 'hover' });
}

// ── Modal helpers ──
function clearModal() {
  document.getElementById('f-title').value    = '';
  document.getElementById('f-desc').value     = '';
  document.getElementById('f-start').value    = '';
  document.getElementById('f-duration').value = '60';
  document.getElementById('f-tags').value     = '';
  document.getElementById('tag-preview').innerHTML = '';
  document.getElementById('modal-error').classList.add('d-none');
}

function openCreate(dateStr) {
  editingId = null;
  clearModal();
  document.getElementById('modal-title').textContent = 'New Event';
  document.getElementById('btn-delete').classList.add('d-none');
  if (dateStr) document.getElementById('f-start').value = dateStr + 'T09:00';
  $('#eventModal').modal('show');
}

async function openEdit(id) {
  editingId = id;
  clearModal();
  document.getElementById('modal-title').textContent = 'Edit Event';
  document.getElementById('btn-delete').classList.remove('d-none');

  const res  = await fetch(`/calendar/events/${id}/`);
  const data = await res.json();

  document.getElementById('f-title').value    = data.title;
  document.getElementById('f-desc').value     = data.description;
  document.getElementById('f-start').value    = data.start;
  document.getElementById('f-duration').value = data.duration;
  document.getElementById('f-tags').value     = data.tags;
  renderTagPreview(data.tags);

  $('#eventModal').modal('show');
}

function showError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.classList.remove('d-none');
}

// ── Tag badge preview ──
function renderTagPreview(raw) {
  const container = document.getElementById('tag-preview');
  container.innerHTML = '';
  raw.split(',').map(t => t.trim()).filter(Boolean).forEach(tag => {
    const b = document.createElement('span');
    b.className = 'badge badge-secondary mr-1';
    b.textContent = tag;
    container.appendChild(b);
  });
}

document.getElementById('f-tags').addEventListener('input', function() {
  renderTagPreview(this.value);
});

// ── Save (create or edit) ──
document.getElementById('btn-save').addEventListener('click', async () => {
  const body = new URLSearchParams({
    title:       document.getElementById('f-title').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    start:       document.getElementById('f-start').value,
    duration:    document.getElementById('f-duration').value,
    tags:        document.getElementById('f-tags').value.trim(),
  });

  const url = editingId
    ? `/calendar/events/${editingId}/edit/`
    : `/calendar/events/create/`;

  const res  = await fetch(url, {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  const data = await res.json();

  if (data.error) { showError(data.error); return; }
  $('#eventModal').modal('hide');
  await loadEvents();
});

// ── Delete ──
document.getElementById('btn-delete').addEventListener('click', async () => {
  if (!confirm('Delete this event?')) return;
  await fetch(`/calendar/events/${editingId}/delete/`, {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF },
  });
  $('#eventModal').modal('hide');
  await loadEvents();
});

// ── Nav buttons ──
document.getElementById('btn-prev').addEventListener('click', () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
});
document.getElementById('btn-next').addEventListener('click', () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
});
document.getElementById('btn-today').addEventListener('click', () => {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  renderCalendar();
});
document.getElementById('btn-new-event').addEventListener('click', () => openCreate(null));

// ── Boot ──
const now = new Date();
currentYear  = now.getFullYear();
currentMonth = now.getMonth();
loadEvents();
</script>
{% endblock %}

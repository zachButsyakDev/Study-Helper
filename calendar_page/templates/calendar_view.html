{% extends "base.html" %}

{% block title %}Calendar | Study Helper{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Calendar</h1>
    <p class="page-subtitle">View upcoming assignments, tests, and personal study events.</p>
</div>

<div class="row">
    <div class="col-md-8 mb-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Upcoming Schedule</h5>

                <div class="text-center py-5">
                    <h5 class="text-muted">No events at this time</h5>
                    <p class="text-muted mb-0">
                        Please create an event to get started.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Add Event</h5>
                <form>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" class="form-control" placeholder="Event title">
                    </div>

                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Add Event</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

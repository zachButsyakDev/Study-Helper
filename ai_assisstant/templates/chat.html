{% extends "base.html" %}
{% block title %}AI Assistant{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    AI Assistant
  </div>
  <div class="card-body">
    <div id="messages" style="height:300px; overflow:auto; border:1px solid #eee; padding:10px;"></div>

    <div class="input-group mt-3">
      <input id="userInput" class="form-control" placeholder="Ask the assistant (summarize, rewrite, quiz)"/>
      <div class="input-group-append">
        <button id="sendBtn" class="btn btn-primary">Send</button>
      </div>
    </div>

    <p class="mt-2 small text-muted">Tip: select text in a note and click "AI Assist" to open inline editor.</p>

    <button id="openEditorBtn" class="btn btn-outline-secondary mt-2">AI Assist (inline)</button>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="aiModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">AI Assist - Edit / Summarize</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <select id="modeSelect" class="form-control mb-2">
          <option value="summarize">Summarize</option>
          <option value="rewrite">Rewrite / Improve</option>
          <option value="quiz">Create Quiz</option>
        </select>
        <textarea id="assistTextarea" class="form-control" rows="8" placeholder="Paste or select note text..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="assistSendBtn" class="btn btn-primary">Send to AI</button>
        <button class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.innerHTML = '<strong>' + role + ':</strong> ' + text.replace(/\n/g,'<br>');
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

async function sendToAI(payload) {
  const resp = await fetch("{% url 'assistant:api_chat' %}", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify(payload)
  });
  return resp.json();
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  const text = document.getElementById('userInput').value.trim();
  if (!text) return;
  appendMessage('You', text);
  document.getElementById('userInput').value = '';
  appendMessage('Assistant', '...thinking...');
  const res = await sendToAI({message: text, mode: 'chat'});
  if (res.ok) {
    // remove last "thinking..." and append real reply
    const messagesDiv = document.getElementById('messages');
    messagesDiv.removeChild(messagesDiv.lastChild);
    appendMessage('Assistant', res.reply);
  } else {
    appendMessage('Assistant', 'Error: ' + res.error);
  }
});

// Inline editor modal behavior
document.getElementById('openEditorBtn').addEventListener('click', () => {
  // try to populate with selected text
  const sel = window.getSelection().toString();
  document.getElementById('assistTextarea').value = sel || '';
  $('#aiModal').modal('show');
});

document.getElementById('assistSendBtn').addEventListener('click', async () => {
  const text = document.getElementById('assistTextarea').value.trim();
  const mode = document.getElementById('modeSelect').value;
  if (!text) return;
  $('#aiModal').modal('hide');
  appendMessage('You (inline)', text);
  appendMessage('Assistant', '...thinking...');
  const res = await sendToAI({message: text, mode: mode});
  const messagesDiv = document.getElementById('messages');
  messagesDiv.removeChild(messagesDiv.lastChild);
  if (res.ok) appendMessage('Assistant', res.reply);
  else appendMessage('Assistant', 'Error: ' + res.error);
});
</script>
{% endblock %}

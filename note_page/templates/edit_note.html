{% extends "base.html" %}

{% block title %}Edit Note | Study Helper{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Note</h1>
    <p class="page-subtitle">Create or update a note for one of your classes.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form>
            <div class="form-group">
                <label for="noteTitle">Note Title</label>
                <input type="text" class="form-control" id="noteTitle" placeholder="Enter note title">
            </div>

            <div class="form-group">
                <label for="noteClass">Class</label>
                <select class="form-control" id="noteClass">
                    <option>Choose a class</option>
                    <option>Biology 101</option>
                    <option>CS 2301</option>
                    <option>Math 1324</option>
                </select>
            </div>

            <div class="form-group">
                <label for="noteContent">Content</label>
                <textarea class="form-control" id="noteContent" rows="10" placeholder="Write your notes here..."></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/notes/noteview/" class="btn btn-outline-secondary">Back</a>
                <button type="submit" class="btn btn-primary">Save Note</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

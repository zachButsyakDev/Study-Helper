{% extends "base.html" %}

{% block title %}Create Note | Study Helper{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Note</h1>
    <p class="text-muted">Add a title and write your note below.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="noteTitle">Note Title</label>
                <input
                    type="text"
                    class="form-control"
                    id="noteTitle"
                    name="title"
                    placeholder="Enter note title">
            </div>

            <div class="form-group">
                <label for="noteBody">Note Body</label>
                <textarea
                    class="form-control"
                    id="noteBody"
                    name="content"
                    rows="10"
                    placeholder="Type your note here..."></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'notes' %}" class="btn btn-outline-secondary">
                    Back
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Note
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
